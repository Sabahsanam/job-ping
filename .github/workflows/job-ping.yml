name: Job Ping

on:
  schedule:
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-ping
  cancel-in-progress: false

jobs:
  scan-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send test email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
        run: |
          python test_email.py

      - name: Run Job Ping
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
        run: |
          python main.py

      - name: Save Job Ping state
        run: |
          if git diff --quiet -- seen_jobs.json state.json; then
            echo "No state changes to save."
            exit 0
          fi

          git config user.name "Job Ping Bot"
          git config user.email "job-ping-bot@users.noreply.github.com"

          git add seen_jobs.json state.json
          git commit -m "Update Job Ping state [skip ci]"
          git push